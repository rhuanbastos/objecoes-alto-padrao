<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050714">
<title>Águia AI Assist · Quebra de Objeções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Layout: shell de app com sidebar expansível + área de módulo em colunas. Tema único, escuro neofuturista. */
:root{--bg:#050714;--fg:#e2e8f0;--cyan:#00f2ff;--violet:#9d4edd;--line:rgba(0,242,255,.2);color-scheme:dark}
html,body{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-size:16px}

#loginGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 500px at 15% 10%,rgba(0,242,255,.14),transparent 60%),radial-gradient(800px 500px at 90% 90%,rgba(157,78,221,.18),transparent 60%),#050714;font-family:Poppins,system-ui,sans-serif}
#loginGate[hidden]{display:none}
.lg-card{width:100%;max-width:400px;text-align:center;padding:40px 30px;border-radius:20px;border:1px solid rgba(0,242,255,.28);background:rgba(10,14,38,.72);backdrop-filter:blur(14px);box-shadow:0 0 60px rgba(0,242,255,.12)}
.lg-eyebrow{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#67e8f9;margin-bottom:14px}
.lg-title{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:38px;line-height:1.05;color:#fff;margin:0 0 12px;letter-spacing:.01em}
.lg-title span{background:linear-gradient(90deg,#00f2ff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-text{font-size:14px;line-height:1.6;color:#cbd5e1;margin:0 0 26px}
#googleBtnContainer{display:flex;justify-content:center;min-height:44px;margin-bottom:6px}
.lg-load{font-size:13px;color:#94a3b8}
.lg-err{display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#fda4af}
</style>

vimento|inverno|fora da temporada|cidade (pequena|menor)|com[eé]rcio/i}],Gr={preco:{rotulo:"Pre\xE7o por m\xB2",variantes:[{angulo:"Reposicionar a compara\xE7\xE3o",gatilho:{nome:"Oportunidade de entrada",desc:"O cliente percebe que est\xE1 olhando a pra\xE7a mais cara da regi\xE3o, n\xE3o a refer\xEAncia justa."},corpo:"Entendo, vale olhar o m\xB2 mesmo. S\xF3 que o comparativo justo \xE9 com a pra\xE7a vizinha: em Balne\xE1rio Cambori\xFA o m\xB2 passa de R$ 15 mil, e aqui ele fica em R$ 12,7 mil em Pi\xE7arras, R$ 11,6 mil em Penha e R$ 10,1 mil em Barra Velha. Voc\xEA entra pagando de 17% a 34% menos por m\xB2, no mesmo litoral catarinense.",fechamento:{moradia:"Quer que eu mostre quantos m\xB2 o seu or\xE7amento compra em cada cidade?",investimento:"Quer que eu monte uma simula\xE7\xE3o lado a lado com Balne\xE1rio Cambori\xFA pra voc\xEA ver o ponto de entrada?"},contra:"O m\xB2 mais baixo n\xE3o \xE9 produto inferior: o desconto vem do est\xE1gio do mercado. Balne\xE1rio Cambori\xFA j\xE1 \xE9 maduro (FipeZap +2,13% em 12 meses), enquanto Pi\xE7arras, Penha e Barra Velha ainda t\xEAm espa\xE7o para ganhar pre\xE7o e aten\xE7\xE3o. Venda o ponto de entrada, n\xE3o um n\xFAmero de retorno.",dados:[{rotulo:"Balne\xE1rio Pi\xE7arras",valor:"R$ 12.687/m\xB2",nota:"17% abaixo de Balne\xE1rio Cambori\xFA",cor:"cyan"},{rotulo:"Penha",valor:"R$ 11.585/m\xB2",nota:"24% abaixo de Balne\xE1rio Cambori\xFA",cor:"cyan"},{rotulo:"Barra Velha",valor:"R$ 10.106/m\xB2",nota:"34% abaixo de Balne\xE1rio Cambori\xFA",cor:"violet"},{rotulo:"Balne\xE1rio Cambori\xFA (r\xE9gua)",valor:"R$ 15.228/m\xB2",nota:"FipeZap, im\xF3veis novos, jun/2026",cor:"slate"}],fonte:"A Corrida dos Bairros (pre\xE7o pedido, out/2026) \xB7 FipeZap (jun/2026)"},{angulo:"Traduzir pre\xE7o em metros",gatilho:{nome:"Ganho tang\xEDvel",desc:"Troca a conversa de desembolso por espa\xE7o e qualidade de vida."},corpo:"Posso te mostrar de outro jeito? Com o mesmo valor que compra um apartamento em Balne\xE1rio Cambori\xFA, aqui voc\xEA leva de 20% a 50% a mais de \xE1rea: cerca de 20% em Pi\xE7arras, 31% em Penha e 51% em Barra Velha. \xC9 espa\xE7o a mais pra fam\xEDlia, sem sair do litoral que voc\xEA j\xE1 conhece.",fechamento:{moradia:"Quer ver como fica a planta desse espa\xE7o a mais no seu or\xE7amento?",investimento:"Quer que eu te mande a conta de \xE1rea e de entrada lado a lado?"},contra:"Conta usada: R$ 15.228 dividido pelo pre\xE7o do m\xB2 de cada cidade. \xC9 compara\xE7\xE3o entre bases diferentes (an\xFAncios contra FipeZap), ent\xE3o apresente como ordem de grandeza e deixe o closer confirmar a tabela do empreendimento.",dados:[{rotulo:"Pi\xE7arras",valor:"+20% de \xE1rea",nota:"pelo mesmo valor investido em Cambori\xFA",cor:"cyan"},{rotulo:"Penha",valor:"+31% de \xE1rea",nota:"pelo mesmo valor investido em Cambori\xFA",cor:"cyan"},{rotulo:"Barra Velha",valor:"+51% de \xE1rea",nota:"pelo mesmo valor investido em Cambori\xFA",cor:"violet"}],fonte:"C\xE1lculo sobre A Corrida dos Bairros (out/2026) e FipeZap (jun/2026)"}]},infra:{rotulo:"Infraestrutura",variantes:[{angulo:"Prova de rotina, n\xE3o promessa",gatilho:{nome:"Seguran\xE7a e pertencimento",desc:"Responde ao medo de ficar isolado com exemplos concretos do dia a dia."},corpo:"Pergunta justa, e eu prefiro que voc\xEA pergunte mesmo. A regi\xE3o funciona o ano inteiro: com\xE9rcio, escolas e hospitais ativos, e o Beto Carrero World, em Penha, mant\xE9m o fluxo de gente fora do ver\xE3o. Voc\xEA fica a cerca de 15 a 20 minutos do Aeroporto de Navegantes, com a BR-101 por perto.",fechamento:{moradia:"Quer que eu te conte como \xE9 a rotina de quem j\xE1 mora aqui o ano todo?",investimento:"Quer ver como a demanda fora da temporada entra na conta da renda?"},contra:"O medo de cidade vazia nasce da diferen\xE7a entre ver\xE3o e inverno. Em vez de negar, reconhe\xE7a a sazonalidade e mostre as \xE2ncoras de demanda (parque, aeroporto, BR-101). Para o investidor, seja transparente: em Penha a ocupa\xE7\xE3o de temporada vai de 46% no ver\xE3o a 29% na baixa.",dados:[{rotulo:"Beto Carrero World",valor:"Penha",nota:"\xC2ncora de turismo o ano todo",cor:"violet"},{rotulo:"Aeroporto de Navegantes",valor:"15 a 20 min",nota:"Acesso a\xE9reo pr\xF3ximo",cor:"cyan"},{rotulo:"BR-101",valor:"Eixo rodovi\xE1rio",nota:"Conex\xE3o com o litoral e as cidades vizinhas",cor:"cyan"},{rotulo:"Bandeira Azul",valor:"Pi\xE7arras e Penha",nota:"Selo de qualidade das praias",cor:"slate"}],fonte:"Base de contexto \xC1guia \xB7 AirROI (ocupa\xE7\xE3o em Penha, ago/2025 a jul/2026)"},{angulo:"O inverno como vantagem",gatilho:{nome:"Qualidade de vida",desc:"Reenquadra a calmaria como benef\xEDcio de quem mora, n\xE3o como falta de estrutura."},corpo:"Entendo a preocupa\xE7\xE3o. Muita gente que mora aqui escolheu justamente isso: no inverno a praia fica tranquila, sem o tr\xE2nsito do ver\xE3o, e a estrutura continua toda funcionando. Voc\xEA tem a calma de uma cidade de praia e a conveni\xEAncia de estar perto de Navegantes e das cidades vizinhas quando precisar de mais.",fechamento:{moradia:"Quer que eu te mostre como \xE9 um dia comum de quem mora aqui em junho?",investimento:"Quer que eu te mostre os n\xFAmeros de ocupa\xE7\xE3o da baixa temporada?"},contra:"Evite prometer movimento. Descreva a rotina real e deixe o cliente imaginar a vida no im\xF3vel. Se ele insistir, ofere\xE7a uma visita fora do ver\xE3o: \xE9 a prova mais forte e n\xE3o custa nada.",dados:[{rotulo:"Ocupa\xE7\xE3o em Penha (ver\xE3o)",valor:"46%",nota:"AirROI, dez a fev",cor:"cyan"},{rotulo:"Ocupa\xE7\xE3o em Penha (baixa)",valor:"29%",nota:"AirROI, jun, ago e set",cor:"violet"},{rotulo:"Aeroporto de Navegantes",valor:"15 a 20 min",nota:"Acesso a\xE9reo pr\xF3ximo",cor:"slate"}],fonte:"AirROI (Penha, ago/2025 a jul/2026) \xB7 Base de contexto \xC1guia"}]},prazo:{rotulo:"Prazo de entrega",variantes:[{angulo:"Trocar incerteza por cronograma",gatilho:{nome:"Redu\xE7\xE3o de risco",desc:"Mostra que prazo e custo t\xEAm regr  \xE9 conhecido e tem mitiga\xE7\xE3o (contrato, hist\xF3rico da construtora, acompanhamento). Para quem vai morar, alinhe a expectativa de data com o closer.",dados:[{rotulo:"INCC acumulado em 12 meses",valor:"6,60%",nota:"FGV, set/2026",cor:"cyan"},{rotulo:"Hist\xF3rico da construtora",valor:"Via closer",nota:"Entregas anteriores e cronograma",cor:"violet"}],fonte:"FGV (INCC, set/2026)"}]},bc:{rotulo:"Comparativo com Cambori\xFA",variantes:[{angulo:"Respeitar o benchmark e mostrar a assimetria",gatilho:{nome:"Oportunidade assim\xE9trica",desc:"Concorda que Cambori\xFA \xE9 a refer\xEAncia e aponta onde a entrada \xE9 mais leve."},corpo:"Concordo, Balne\xE1rio Cambori\xFA \xE9 a refer\xEAncia, e por isso o comparativo ajuda: l\xE1 o m\xB2 est\xE1 em R$ 15,2 mil e subiu 2,13% nos \xFAltimos 12 meses (FipeZap, jun/2026), um mercado j\xE1 maduro. Aqui voc\xEA entra de 17% a 34% abaixo, numa regi\xE3o ainda em forma\xE7\xE3o. A tese n\xE3o \xE9 prometer n\xFAmero, \xE9 ponto de entrada mais leve e espa\xE7o pra crescer.",fechamento:{moradia:"Quer comparar o que o mesmo or\xE7amento compra l\xE1 e aqui?",investimento:"Quer ver a simula\xE7\xE3o das duas pra\xE7as lado a lado?"},contra:"N\xE3o critique Cambori\xFA: o cliente confia nela. Use-a como r\xE9gua. Itapema (R$ 15.327/m\xB2, +5,25% em 12 meses) refor\xE7a que o eixo \xE9 valorizado; a diferen\xE7a \xE9 o est\xE1gio do mercado.",dados:[{rotulo:"Balne\xE1rio Cambori\xFA",valor:"R$ 15.228/m\xB2",nota:"+2,13% em 12 meses (FipeZap)",cor:"slate"},{rotulo:"Itapema",valor:"R$ 15.327/m\xB2",nota:"+5,25% em 12 meses (FipeZap)",cor:"slate"},{rotulo:"Balne\xE1rio Pi\xE7arras",valor:"\u221217% no m\xB2",nota:"R$ 12.687/m\xB2, pre\xE7o pedido",cor:"cyan"},{rotulo:"Barra Velha",valor:"\u221234% no m\xB2",nota:"R$ 10.106/m\xB2, pre\xE7o pedido",cor:"violet"}],fonte:"FipeZap (jun/2026) \xB7 A Corrida dos Bairros (out/2026)"},{angulo:"Descobrir o que pesa em Cambori\xFA",gatilho:{nome:"Escuta ativa",desc:"Entende a motiva\xE7\xE3o do cliente antes de comparar n\xFAmeros."},corpo:"Cambori\xFA \xE9 \xF3tima, e d\xE1 pra entender a escolha. Me conta: o que mais pesa pra voc\xEA l\xE1, a estrutura pronta, a liquidez ou o status? Pergunto porque, dependendo da resposta, a conta aqui fecha de um jeito bem diferente, principalmente no valor de entrada.",fechamento:{moradia:"O que voc\xEA mais valoriza no dia a dia de l\xE1?",investimento:"Qual \xE9 o retorno que voc\xEA espera do im\xF3vel, renda ou valoriza\xE7\xE3o?"},contra:"Quando o cliente compara, ele j\xE1 est\xE1 comprando em outra cabe\xE7a. Pergunte antes de rebater: a resposta diz qual dado usar (m\xB2 mais baixo, espa\xE7o, renda ou prazo).",dados:[{rotulo:"Balne\xE1rio Cambori\xFA",valor:"R$ 15.228/m\xB2",nota:"FipeZap, jun/2026",cor:"slate"},{rotulo:"Penha",valor:"\u221224% no m\xB2",nota:"R$ 11.585/m\xB2, pre\xE7o pedido",cor:"cyan"}],fonte:"FipeZap (jun/2026) \xB7 A Corrida dos Bairros (out/2026)"}]},livre:{rotulo:"Obje\xE7\xE3o livre",variantes:[{angulo:"Validar e descobrir",gatilho:{nome:"Escuta ativa",desc:"Mostra interesse real antes de argumentar."},corpo:"Obrigado por falar isso com franqueza, ajuda muito. Antes de eu responder, me conta: hoje o que pesa mais pra voc\xEA, o valor, o prazo ou ter seguran\xE7a sobre a regi\xE3o? Assim eu te mostro s\xF3 o que importa pra sua decis\xE3o.",fechamento:{moradia:"",investimento:""},contra:"Sem dado espec\xEDfico para essa obje\xE7\xE3o ainda. Devolva uma pergunta aberta, descubra o que est\xE1 por tr\xE1s e volte com os n\xFAmeros certos (pre\xE7o por m\xB2, prazo, infraestrutura ou comparativo).",dados:[],fonte:""},{angulo:"Espelhar e aprofundar",gatilho:{nome:"Empatia",desc:"Repete o que o cliente disse para ele sentir que foi ouvido."},corpo:"Entendi o seu ponto, e faz sentido ele existir. Pra eu te responder direito, e n\xE3o de forma gen\xE9rica: o que exatamente te deixa inseguro nisso? Se eu entender o que est\xE1 por tr\xE1s, te mostro os n\xFAmeros que realmente respondem a <script>
(function(){
  var gate=document.getElementById('loginGate'), box=document.getElementById('googleBtnContainer'), err=document.getElementById('loginError');
  function erro(m){ err.textContent=m; err.style.display='block'; }
  function entrar(u){
    var nome=(u.nome||'').trim()||String(u.email||'').split('@')[0];
    gate.hidden=true;
    window.AguiaMontar({nome:nome,email:u.email||''}, sair);
  }
  async function sair(){ try{ await fetch('/api/logout',{method:'POST'}); }catch(e){} location.reload(); }
  async function aoCredencial(resp){
    err.style.display='none';
    try{
      var r=await fetch('/api/auth-google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:resp.credential})});
      var d=await r.json().catch(function(){return {};});
      if(!r.ok){ erro((d&&d.error)||'Não foi possível entrar. Tente de novo.'); return; }
      entrar(d);
    }catch(e){ erro('Falha ao conectar. Tente de novo em instantes.'); }
  }
  function botao(id,n){
    if(!window.google||!google.accounts||!google.accounts.id){ if((n||0)<60) setTimeout(function(){botao(id,(n||0)+1);},300); else erro('Não consegui carregar o login do Google. Recarregue a página.'); return; }
    google.accounts.id.initialize({client_id:id,callback:aoCredencial});
    box.innerHTML='';
    google.accounts.id.renderButton(box,{theme:'filled_black',size:'large',text:'continue_with'});
  }
  (async function(){
    try{
      var m=await fetch('/api/me');
      if(m.ok){ entrar(await m.json()); return; }
    }catch(e){}
    try{
      var c=await (await fetch('/api/config')).json();
      if(c&&c.googleClientId) botao(c.googleClientId);
      else { box.innerHTML=''; erro('Login com Google ainda não configurado.'); }
    }catch(e){ box.innerHTML=''; erro('Não consegui carregar a tela de login. Recarregue a página.'); }
  })();
})();
</script>
